</head>
<body>
        <header class="header">
        <div class="logo"><i class="fas fa-car"></i> Auto<span>Wise</span></div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="buy.html">Buy</a>
            <a href="sell.html">Sell</a>

            <a href="contact.html" class="active">Contact Us</a>

        <div class="header-actions">
            <a href="login.html" class="btn-outline"><i class="fas fa-user"></i> Login</a>
            <a href="wishlist.html" class="wishlist-link"><i class="fas fa-heart"></i><span class="badge" id="wishlistBadge">0</span></a>
            
        </div>
    </header>


    <div class="container">
        <section class="form-section" style="max-width:700px;">
            <h1>Contact Us</h1>
            <p>Have questions or need help? Reach out to us!</p>
            <form id="contactForm">
                <div class="form-group"><label>Your Name</label><input type="text" id="contactName" placeholder="Full name" required /></div>
                <div class="form-group"><label>Email Address</label><input type="email" id="contactEmail" placeholder="you@example.com" required /></div>
                <div class="form-group"><label>Phone Number</label><input type="tel" id="contactPhone" placeholder="9876543210" required /></div>
                <div class="form-group"><label>Message</label><textarea id="contactMessage" rows="5" placeholder="How can we help you?" required></textarea></div>
                <button type="submit" class="btn-submit"><i class="fas fa-envelope"></i> Send via Email</button>
            </form>
            
            <div class="contact-info">
                <div class="info-item"><i class="fas fa-map-marker-alt"></i><h4>Visit Us</h4><p>Pune Street Road, Maharashtra, India</p></div>
                <div class="info-item"><i class="fas fa-envelope"></i><h4>Email</h4><p>autowise@gmail.com</p></div>
            </div>
            <div class="map-container">
                <iframe src="https://maps.google.com/maps?q=pune&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="300" frameborder="0" style="border:0;" allowfullscreen="" loading="lazy" title="Map showing our location in Pune"></iframe>
            </div>
        </section>
    </div>

    
    <div class="modal-overlay" id="detailModal">...</div>
    <footer class="footer">
    <div class="bottom">© 2026 AutoWise. All rights reserved. Built with <i class="fas fa-heart" style="color:var(--secondary);"></i> for India.</div>
    </footer>
    

    <script src="js/data.js"></script>

    <script src="js/chatbot.js"></script>
</body>
</html>
